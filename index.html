<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Hanken+Grotesk:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <nav class="tabs">
    <img class="brand" src="logo.png" alt="Logo" height="32" width="32">
    <div class="tabs-list" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Today</button>
      <button role="tab" data-tab="plan" aria-selected="false">Plan</button>
      <button role="tab" data-tab="bilan" aria-selected="false">Review</button>
      <button role="tab" data-tab="calendar" aria-selected="false">Calendar</button>
    </div>
  </nav>

  <div class="page">
    <button id="brush" class="ghost brush" type="button" aria-label="Customize the banner" title="Customize the banner"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18.4 2.6a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/><path d="M7.5 13.5c-2.2 0-3.5 1.3-3.5 3.2 0 1.6-.8 2.6-2.5 3.3 2.6 1.3 6.5.9 7.9-1.6"/></svg></button>
    <h1 id="page-title"></h1>
    <section id="today"></section>
    <section id="plan" hidden>
      <div class="subtabs" role="tablist" data-group="plan">
        <button role="tab" data-sub="tasks" aria-selected="true">Tasks</button>
        <button role="tab" data-sub="sections" aria-selected="false">Sections</button>
        <button role="tab" data-sub="projects" aria-selected="false">Projects</button>
      </div>
      <section id="tasks" hidden></section>
      <section id="sections" hidden></section>
      <section id="projects" hidden></section>
    </section>
    <section id="bilan" hidden>
      <div class="subtabs" role="tablist" data-group="bilan">
        <button role="tab" data-sub="review" aria-selected="true">Review</button>
        <button role="tab" data-sub="week" aria-selected="false">Week</button>
      </div>
      <section id="review" hidden></section>
      <section id="week" hidden></section>
    </section>
    <section id="calendar" hidden></section>
    <footer class="data">
      <button id="export" class="ghost" type="button">Export my data</button>
      <button id="import" class="ghost" type="button">Import</button>
      <button id="csv" class="ghost" type="button">Export tasks (CSV)</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
    </footer>
  </div>
  <footer class="credit">Made by Mathilde</footer>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<div id="timer" hidden></div>

<script src="app.js"></script>
</body>
</html>
